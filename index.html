  /* ---------- helpers ---------- */
  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function pick(arr){ return arr[randInt(0,arr.length-1)]; }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=randInt(0,i); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function capitalize(s){
    if(s.indexOf('j’')===0) return 'J’'+s.slice(2);
    return s.charAt(0).toUpperCase()+s.slice(1);
  }
  function reducedMotion(){
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }
  function speak(text){
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'fr-FR';
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }catch(e){ /* speech not available */ }
  }
  function speakSequence(lines, idx){
    idx = idx || 0;
    try{
      if(!('speechSynthesis' in window)) return;
      if(idx===0) window.speechSynthesis.cancel();
      if(idx>=lines.length) return;
      var u = new SpeechSynthesisUtterance(lines[idx]);
      u.lang = 'fr-FR';
      u.rate = 0.85;
      u.onend = function(){ speakSequence(lines, idx+1); };
      window.speechSynthesis.speak(u);
    }catch(e){ /* speech not available */ }
  }

  function genPair(level, op){
    var a,b,res;
    if(op==='add'){
      if(level==='CP'){ a=randInt(1,9); b=randInt(0,10-a); }
      else if(level==='CE1'){ a=randInt(5,60); b=randInt(5,Math.min(60,98-a)); }
      else if(level==='CE2'){ a=randInt(10,500); b=randInt(10,Math.min(490,998-a)); }
      else if(level==='CM1'){ a=randInt(100,5000); b=randInt(100,Math.min(4000,9998-a)); }
      else { a=randInt(1000,50000); b=randInt(1000,Math.min(40000,99998-a)); }
      res=a+b;
    } else if(op==='sub'){
      if(level==='CP'){ a=randInt(2,10); b=randInt(0,a); }
      else if(level==='CE1'){ a=randInt(10,99); b=randInt(0,a); }
      else if(level==='CE2'){ a=randInt(100,999); b=randInt(0,a); }
      else if(level==='CM1'){ a=randInt(1000,9999); b=randInt(0,a); }
      else { a=randInt(10000,99999); b=randInt(0,a); }
      res=a-b;
    } else {
      if(level==='CE1'){ a=pick([2,5,10]); b=randInt(1,10); }
      else if(level==='CE2'){ a=randInt(2,10); b=randInt(1,10); }
      else if(level==='CM1'){ a=randInt(11,99); b=randInt(2,9); }
      else { a=randInt(11,99); b=randInt(11,99); }
      if(Math.random()<0.5){ var t=a; a=b; b=t; }
      res=a*b;
    }
    return {a:a,b:b,res:res};
  }

  function buildChoices(res){
    var set = [res];
    var guard = 0;
    while(set.length<4 && guard<50){
      guard++;
      var delta = randInt(1, Math.max(3, Math.round(res*0.15)+2));
      var cand = Math.random()<0.5 ? res+delta : res-delta;
      if(cand>=0 && set.indexOf(cand)===-1) set.push(cand);
    }
    return shuffle(set);
  }

  function buildObjetsQuestion(op,a,b,res){
    var emoji = '🍎';
    var html, group, i;
    if(op==='add'){
      html = '<div class="objets-row"><span class="objets-group">'+emoji.repeat(a)+'</span><span class="objets-op">+</span><span class="objets-group">'+emoji.repeat(b)+'</span></div>' +
        '<p class="objets-question">Combien de pommes en tout ?</p>';
    } else {
      group='';
      for(i=0;i<a;i++){ group += i<b ? '<span class="crossed">'+emoji+'</span>' : emoji; }
      html = '<div class="objets-row"><span class="objets-group">'+group+'</span></div>' +
        '<p class="objets-question">On enlève '+b+'. Combien en reste-t-il ?</p>';
    }
    return {kind:'input', html:html, answer:res};
  }

  function buildMathQuestion(level, op, mode){
    var pair = genPair(level, op);
    var a=pair.a, b=pair.b, res=pair.res;
    var sym = OP_INFO[op].symbol;
    if(mode==='objets'){ return buildObjetsQuestion(op,a,b,res); }
    if(mode==='trou'){
      var hide = pick(['a','b','res']);
      var text, answer;
      if(hide==='a'){ text = '? '+sym+' '+b+' = '+res; answer = op==='add' ? res-b : (op==='sub' ? res+b : res/b); }
      else if(hide==='b'){ text = a+' '+sym+' ? = '+res; answer = op==='add' ? res-a : (op==='sub' ? a-res : res/a); }
      else { text = a+' '+sym+' '+b+' = ?'; answer = res; }
      return {kind:'input', text:text, answer:answer};
    }
    if(mode==='qcm'){
      var qtext = a+' '+sym+' '+b+' = ?';
      return {kind:'choice', text:qtext, answer:res, choices:buildChoices(res)};
    }
    var dtext = a+' '+sym+' '+b+' = ?';
    return {kind:'input', text:dtext, answer:res};
  }

  function startMathSession(){
    state.session = { section:'math', total:10, index:0, correct:0, current:null, locked:false };
    nextMathQuestion();
  }
  function nextMathQuestion(){
    state.session.current = buildMathQuestion(state.math.level, state.math.op, state.math.mode);
    state.session.locked = false;
    renderMathPlay();
  }

  function progressBlock(){
    var s = state.session;
    var pct = Math.round((s.index/s.total)*100);
    return '<div class="progress-row">' +
      '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>' +
      '<span class="progress-count">'+s.index+' / '+s.total+'</span>' +
    '</div>';
  }

    var s = state.session;
    var q = s.current;
    var body = '<div class="card" style="--accent:var(--accent-math)">' +
      progressBlock() +
      (q.html ? q.html : '<p class="question-text">'+q.text+'</p>');
    if(q.kind==='choice'){
      body += '<div class="choice-answers" id="answerZone">' +
        q.choices.map(function(c){ return '<button class="choice-btn" data-val="'+c+'">'+c+'</button>'; }).join('') +
      '</div>';
    } else {
      body += '<div class="answer-row" id="answerZone">' +
        '<input class="answer-input" id="mathInput" type="text" inputmode="numeric" autocomplete="off" placeholder="?" />' +
        '<button class="btn-validate" id="mathValidate">Valider</button>' +
      '</div>';
    }
    body += '<div id="feedbackZone"></div>';
    body += '</div>';
    shell(body, function(){ go('math-mode'); });

    if(q.kind==='choice'){
      Array.prototype.forEach.call(document.querySelectorAll('.choice-btn'), function(btn){
        btn.addEventListener('click', function(){ evalMathChoice(parseInt(btn.getAttribute('data-val'),10), btn); });
      });
    } else {
      var input = document.getElementById('mathInput');
      var vbtn = document.getElementById('mathValidate');
      input.focus();
      function submit(){ evalMathInput(input.value); }
      vbtn.addEventListener('click', submit);
      input.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
    }
  }

  function lockAnswerZone(){
    Array.prototype.forEach.call(document.querySelectorAll('#answerZone button, #answerZone input'), function(el){ el.disabled = true; });
  }

  function mathFeedback(correct, correctVal){
    var s = state.session;
    if(correct) s.correct++;
    s.index++;
    var msgGood = pick(['Bravo !','Super !','Génial !','Trop fort !','Bien joué !']);
    var html = correct
      ? '<div class="feedback good">'+msgGood+' ✨</div>'
      : '<div class="feedback bad">Presque !<small>La bonne réponse était '+correctVal+'</small></div>';
    document.getElementById('feedbackZone').innerHTML = html +
      '<div class="actions-row"><button class="btn-primary" id="nextBtn">'+(s.index>=s.total?'Voir mon score':'Suivant')+'</button></div>';
    document.getElementById('nextBtn').addEventListener('click', function(){
      if(s.index>=s.total){ go('math-result'); } else { nextMathQuestion(); }
    });
  }

  function evalMathChoice(val, btn){
    var s = state.session;
    if(s.locked) return;
    s.locked = true;
    var correct = val === state.session.current.answer;
    lockAnswerZone();
    Array.prototype.forEach.call(document.querySelectorAll('.choice-btn'), function(b){
      var v = parseInt(b.getAttribute('data-val'),10);
      if(v===state.session.current.answer) b.classList.add('is-correct');
      else if(b===btn) b.classList.add('is-wrong');
      else b.classList.add('is-dim');
    });
    mathFeedback(correct, state.session.current.answer);
  }

  function evalMathInput(raw){
    var s = state.session;
    if(s.locked) return;
    var val = parseInt(String(raw).trim(),10);
    if(isNaN(val)) return;
    s.locked = true;
    lockAnswerZone();
    mathFeedback(val === s.current.answer, s.current.answer);

  /* ================= VERBES ================= */
  function conjugate(verb, tense, pronoun){
    if(IRREGULAR_VERBS[verb]) return IRREGULAR_VERBS[verb][tense][pronoun];
    var isGroup2 = verb.slice(-2)==='ir';
    var stem = verb.slice(0,-2);
    if(tense==='present'){
      if(isGroup2){
        var endings2 = {je:'is',tu:'is',il:'it',nous:'issons',vous:'issez',ils:'issent'};
        return stem+endings2[pronoun];
      }
      var endings1 = {je:'e',tu:'es',il:'e',nous:(verb.slice(-3)==='ger'?'eons':'ons'),vous:'ez',ils:'ent'};
      return stem+endings1[pronoun];
    }
    if(tense==='futur'){
      var fEndings = {je:'ai',tu:'as',il:'a',nous:'ons',vous:'ez',ils:'ont'};
      return verb+fEndings[pronoun];
    }
    if(tense==='passeSimple'){
      if(isGroup2){
        var psEndings2 = {je:'is',tu:'is',il:'it',nous:'îmes',vous:'îtes',ils:'irent'};
        return stem+psEndings2[pronoun];
      }
      var psEndings1 = {je:'ai',tu:'as',il:'a',nous:'âmes',vous:'âtes',ils:'èrent'};
      var psStem = (verb.slice(-3)==='ger' && pronoun!=='ils') ? stem+'e' : stem;
      return psStem+psEndings1[pronoun];
    }
    var aux = {je:'ai',tu:'as',il:'a',nous:'avons',vous:'avez',ils:'ont'};
    return aux[pronoun]+' '+stem+(isGroup2?'i':'é');
  }

  function subjectFor(pronoun, form){
    var subj = pick(PRONOUN_SUBJECTS[pronoun]);
    if(pronoun==='je'){
      return /^[aeiouhéèê]/i.test(form) ? 'j’'+form : 'je '+form;
    }
    return subj+' '+form;
  }

  function canonicalSubject(pronoun, form){
    if(pronoun==='je'){
      return /^[aeiouhéèê]/i.test(form) ? 'j’'+form : 'je '+form;
    }
    return PRONOUN_DISPLAY[pronoun]+' '+form;
  }

  function speakableLine(pronoun, form){
    if(pronoun==='je'){
      return /^[aeiouhéèê]/i.test(form) ? 'j’'+form : 'je '+form;
    }
    return SPEAK_PRONOUN[pronoun]+' '+form;
  }

  function buildVerbQuestion(pool, tense){
    var actualTense = tense==='melange' ? pick(['present','passe','futur','passeSimple']) : tense;
    var verb = pick(pool);
    var target = pick(PRONOUNS);
    var others = shuffle(PRONOUNS.filter(function(p){ return p!==target; })).slice(0,3);
    var correctText = capitalize(subjectFor(target, conjugate(verb,actualTense,target)));
    var choiceTexts = shuffle([correctText].concat(others.map(function(p){
      return capitalize(subjectFor(p, conjugate(verb,actualTense,p)));
    })));
    return {
      verb:verb, tense:actualTense, pronoun:target,
      prompt:'Conjugue <strong style="color:var(--accent-fr)">'+verb+'</strong> au <strong>'+TENSE_INFO[actualTense].label+'</strong> avec <strong>'+PRONOUN_DISPLAY[target]+'</strong>',
      answer:correctText, choices:choiceTexts
    };
  }

  function distractorWords(letter, n){
    var others = shuffle(SOUND_LETTERS.filter(function(l){ return l!==letter; }));
    var words = [];
    for(var i=0;i<others.length && words.length<n;i++){ words.push(pick(WORD_BANK[others[i]])); }
    return words;
  }

  function buildLectureQuestion(letter, mode){
    if(mode==='reconnaitre'){
      var correct = pick(WORD_BANK[letter]);
      var choices = shuffle([correct].concat(distractorWords(letter,3)));
      var reconPrompt = GRAPHEME_MODE[letter]==='contains' ? 'Quel mot contient le son « '+letter+' » ?' : 'Quel mot commence par « '+letter+' » ?';
      return {kind:'reconnaitre', prompt:reconPrompt, answer:correct, choices:choices};
    }
    if(mode==='ecouter'){
      var target = pick(WORD_BANK[letter]);
      var choices2 = shuffle([target].concat(distractorWords(letter,3)));
      return {kind:'ecouter', prompt:'Écoute puis choisis le bon mot.', answer:target, choices:choices2, speakWord:target};
    }
    var word = pick(WORD_BANK[letter]);
    var idx = word.indexOf(letter);
    var prefix = word.slice(0, idx);
    var suffix = word.slice(idx + letter.length);
    var otherLetters = shuffle(SOUND_LETTERS.filter(function(l){ return l!==letter; })).slice(0,3);
    var choices3 = shuffle([letter].concat(otherLetters));
    return {kind:'completer', prompt:'Complète le mot :', word:word, prefix:prefix, suffix:suffix, answer:letter, choices:choices3};
  }

    shell(body, function(){ go('home'); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-geocat]'), function(btn){
      btn.addEventListener('click', function(){ startGeoSession(btn.getAttribute('data-geocat')); });
    });
  }

  function startGeoSession(category){
    state.geo.category = category;
    state.session = { section:'geo', total:8, index:0, correct:0, current:null, locked:false };
    nextGeoQuestion();
  }
  function nextGeoQuestion(){
    state.session.current = state.geo.category==='fleuves' ? buildFleuveQuestion() : buildCapitaleQuestion();
    state.session.locked = false;
    renderGeoPlay();
  }

  function renderGeoPlay(){
    var s = state.session;
    var q = s.current;
    var body = '<div class="card" style="--accent:var(--accent-geo)">' +
      progressBlock() +
      '<p class="question-text" style="font-size:24px;">'+q.prompt+'</p>' +
      '<div class="choice-answers" id="answerZone">' +
        q.choices.map(function(c){ return '<button class="choice-btn" data-val="'+encodeURIComponent(c)+'">'+c+'</button>'; }).join('') +
      '</div>' +
      '<div id="feedbackZone"></div>' +
    '</div>';
    shell(body, function(){ go('geo-category'); });
    Array.prototype.forEach.call(document.querySelectorAll('.choice-btn'), function(btn){
      btn.addEventListener('click', function(){ evalGeoChoice(decodeURIComponent(btn.getAttribute('data-val')), btn); });
    });
  }

  function evalGeoChoice(val, btn){
    var s = state.session;
    if(s.locked) return;
    s.locked = true;
    var correct = val === s.current.answer;
    lockAnswerZone();
    Array.prototype.forEach.call(document.querySelectorAll('.choice-btn'), function(b){
      var v = decodeURIComponent(b.getAttribute('data-val'));
      if(v===s.current.answer) b.classList.add('is-correct');
      else if(b===btn) b.classList.add('is-wrong');
      else b.classList.add('is-dim');
    });
    if(correct) s.correct++;
    s.index++;
    var msgGood = pick(['Bravo !','Super !','Génial !','Trop fort !','Bien joué !']);
    document.getElementById('feedbackZone').innerHTML =
      (correct ? '<div class="feedback good">'+msgGood+' ✨</div>' : '<div class="feedback bad">Presque !<small>La bonne réponse était « '+s.current.answer+' »</small></div>') +
      '<div class="actions-row"><button class="btn-primary" id="nextBtn">'+(s.index>=s.total?'Voir mon score':'Suivant')+'</button></div>';
    document.getElementById('nextBtn').addEventListener('click', function(){
      if(s.index>=s.total){ go('geo-result'); } else { nextGeoQuestion(); }
    });
  }

  function renderGeoResult(){ renderGenericResult('geo-category', 'Rejouer', 'Changer de thème'); }

  /* ================= HISTOIRE ================= */
  function buildHistoireQueue(period){
    var qs = HISTOIRE_PERIODS[period].questions;
    return shuffle(qs.map(function(q){
      return { prompt:q.q, answer:q.answer, choices:shuffle(q.choices.slice()) };
    }));
  }

  function renderHistoirePeriod(){
    var buttons = Object.keys(HISTOIRE_PERIODS).map(function(key){
      var info = HISTOIRE_PERIODS[key];
      return '<button class="pick-btn" data-period="'+key+'"><span class="big">'+info.icon+'</span>'+info.label+'</button>';
    }).join('');
    var body =
      '<div class="section-title"><span class="icon" style="color:var(--accent-histoire)">'+ICONS.histoire+'</span><h2>Quelle période veux-tu explorer ?</h2></div>' +
      '<div class="choice-grid">'+buttons+'</div>';
    shell(body, function(){ go('home'); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-period]'), function(btn){
      btn.addEventListener('click', function(){ startHistoireSession(btn.getAttribute('data-period')); });
    });
  }

  function startHistoireSession(period){
    state.histoire.period = period;
    var queue = buildHistoireQueue(period);
    state.session = { section:'histoire', total:queue.length, index:0, correct:0, current:null, locked:false, queue:queue };
    nextHistoireQuestion();
  }
  function nextHistoireQuestion(){
    state.session.current = state.session.queue[state.session.index];
    state.session.locked = false;
    renderHistoirePlay();
  }

  function renderHistoirePlay(){
    var s = state.session;
    var q = s.current;
    var body = '<div class="card" style="--accent:var(--accent-histoire)">' +
      progressBlock() +
      '<p class="question-text" style="font-size:22px;">'+q.prompt+'</p>' +
      '<div class="choice-answers" id="answerZone">' +
        q.choices.map(function(c){ return '<button class="choice-btn" data-val="'+encodeURIComponent(c)+'">'+c+'</button>'; }).join('') +
      '</div>' +
      '<div id="feedbackZone"></div>' +
    '</div>';
    shell(body, function(){ go('histoire-period'); });
    Array.prototype.forEach.call(document.querySelectorAll('.choice-btn'), function(btn){
      btn.addEventListener('click', function(){ evalHistoireChoice(decodeURIComponent(btn.getAttribute('data-val')), btn); });
    });
  }

  function evalHistoireChoice(val, btn){
    var s = state.session;
    if(s.locked) return;
    s.locked = true;
    var correct = val === s.current.answer;
    lockAnswerZone();
    Array.prototype.forEach.call(document.querySelectorAll('.choice-btn'), function(b){
      var v = decodeURIComponent(b.getAttribute('data-val'));
      if(v===s.current.answer) b.classList.add('is-correct');
      else if(b===btn) b.classList.add('is-wrong');
      else b.classList.add('is-dim');
    });
    if(correct) s.correct++;
    s.index++;
    var msgGood = pick(['Bravo !','Super !','Génial !','Trop fort !','Bien joué !']);
    document.getElementById('feedbackZone').innerHTML =
      (correct ? '<div class="feedback good">'+msgGood+' ✨</div>' : '<div class="feedback bad">Presque !<small>La bonne réponse était « '+s.current.answer+' »</small></div>') +
      '<div class="actions-row"><button class="btn-primary" id="nextBtn">'+(s.index>=s.total?'Voir mon score':'Suivant')+'</button></div>';
    document.getElementById('nextBtn').addEventListener('click', function(){
      if(s.index>=s.total){ go('histoire-result'); } else { nextHistoireQuestion(); }
    });
  }

  function renderHistoireResult(){ renderGenericResult('histoire-period', 'Rejouer', 'Changer de période'); }

  /* ================= RESULT (shared) ================= */
  function renderGenericResult(changeScreen, replayLabel, changeLabel){
    var s = state.session;
    var pct = s.total ? s.correct/s.total : 0;
    var tier;
    if(pct>=0.9){ tier={emoji:'🏆', msg:'Parfait !', stars:3}; }
    else if(pct>=0.7){ tier={emoji:'🌟', msg:'Bravo, excellent travail !', stars:2}; }
    else if(pct>=0.4){ tier={emoji:'👍', msg:'Bien joué, continue !', stars:1}; }
    else { tier={emoji:'🌱', msg:'Continue à t’entraîner, tu vas y arriver !', stars:0}; }
    state.stars += tier.stars;
    saveStars();
    var body = '<div class="card result-card">' +
      '<div class="result-emoji">'+tier.emoji+'</div>' +
      '<div class="result-score">'+s.correct+' / '+s.total+'</div>' +
      '<p class="result-msg">'+tier.msg+'</p>' +
      '<div class="result-stars">'+'⭐'.repeat(tier.stars)+(tier.stars===0?'☆☆☆':'') +'</div>' +
      '<div class="actions-row">' +
        '<button class="btn-primary" id="btnReplay">'+replayLabel+'</button>' +
        '<button class="btn-secondary" id="btnChange">'+changeLabel+'</button>' +
        '<button class="btn-secondary" id="btnHome">Accueil</button>' +
      '</div>' +
    '</div>';
    shell(body, function(){ go(changeScreen); });
    document.getElementById('btnReplay').addEventListener('click', function(){
      if(state.session.section==='math') startMathSession();
      else if(state.session.section==='verb') startVerbSession();
      else if(state.session.section==='lecture') startLectureSession();
      else if(state.session.section==='tables') startTablesSession(state.session.tableNumber);
      else if(state.session.section==='geo') startGeoSession(state.geo.category);
      else startHistoireSession(state.histoire.period);
    });
    document.getElementById('btnChange').addEventListener('click', function(){ go(changeScreen); });
    document.getElementById('btnHome').addEventListener('click', function(){ go('home'); });

    if(tier.stars>=2 && !reducedMotion()) burstStars();
  }

  function burstStars(){
    var layer = document.createElement('div');
    layer.style.position='fixed'; layer.style.inset='0'; layer.style.pointerEvents='none'; layer.style.zIndex='50';
    document.body.appendChild(layer);
    for(var i=0;i<16;i++){
      var s = document.createElement('span');
      s.textContent = '⭐';
      s.style.position='absolute';
      s.style.left = (10+Math.random()*80)+'%';
      s.style.top = '-40px';
      s.style.fontSize = (16+Math.random()*16)+'px';
      s.style.transition = 'transform 1.6s ease-in, opacity 1.6s ease-in';
      s.style.opacity = '1';
      layer.appendChild(s);
      (function(el){
        requestAnimationFrame(function(){
          el.style.transform = 'translateY(' + (window.innerHeight+80) + 'px) rotate(' + (Math.random()*360) + 'deg)';
          el.style.opacity='0';
        });
      })(s);
    }
    setTimeout(function(){ layer.remove(); }, 1800);
  }

  /* ================= ROUTER ================= */
  function render(){
    switch(state.screen){
      case 'home': return renderHome();
      case 'math-level': return renderMathLevel();
      case 'math-op': return renderMathOp();
      case 'math-mode': return renderMathMode();
      case 'math-result': return renderMathResult();
      case 'verb-category': return renderVerbCategory();
      case 'verb-learn': return renderVerbLearn();
      case 'verb-tense': return renderVerbTense();
      case 'verb-result': return renderVerbResult();
      case 'lecture-letter': return renderLectureLetter();
      case 'lecture-mode': return renderLectureMode();
      case 'lecture-result': return renderLectureResult();
      case 'tables-select': return renderTablesSelect();
      case 'tables-mode': return renderTablesMode();
      case 'tables-learn': return renderTablesLearn();
      case 'tables-result': return renderTablesResult();
      case 'geo-category': return renderGeoCategory();
      case 'geo-result': return renderGeoResult();
      case 'histoire-period': return renderHistoirePeriod();
      case 'histoire-result': return renderHistoireResult();
      default: return renderHome();
    }
  }

  if(isUnlocked()){ render(); } else { renderLock(); }
})();
</script>
